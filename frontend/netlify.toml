[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA redirect — all routes go to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# API proxy — forward /api calls to Render backend
[[redirects]]
  from   = "/api/*"
  to     = "https://osint-threat-intelligence-platform-82p9.onrender.com/api/:splat"
  status = 200
  force  = true

# WebSocket proxy
[[redirects]]
  from   = "/ws/*"
  to     = "https://osint-threat-intelligence-platform-82p9.onrender.com/ws/:splat"
  status = 200
  force  = true
